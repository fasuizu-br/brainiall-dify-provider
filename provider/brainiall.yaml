provider: brainiall
label:
  en_US: BRAINIALL Speech
  pt_BR: BRAINIALL Voz
description:
  en_US: Brazilian Portuguese transcription with speaker diarization and pt-BR speech synthesis.
  pt_BR: Transcricao em portugues brasileiro com diarizacao e sintese de voz pt-BR.
icon_small:
  en_US: brainiall.png
  pt_BR: brainiall.png
icon_large:
  en_US: brainiall.png
  pt_BR: brainiall.png
background: "#0B1220"
help:
  title:
    en_US: Create a BRAINIALL API key
    pt_BR: Crie uma chave de API BRAINIALL
  url:
    en_US: https://app.brainiall.com
    pt_BR: https://app.brainiall.com
supported_model_types:
  - speech2text
  - tts
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        pt_BR: Chave de API
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your BRAINIALL API key
        pt_BR: Insira sua chave de API BRAINIALL
models:
  speech2text:
    predefined:
      - models/speech2text/*.yaml
  tts:
    predefined:
      - models/tts/*.yaml
extra:
  python:
    provider_source: provider/brainiall.py
    model_sources:
      - models/speech2text/speech2text.py
      - models/tts/tts.py
