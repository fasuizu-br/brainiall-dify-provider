[project]
name = "brainiall-dify-provider"
version = "0.1.0"
description = "BRAINIALL Brazilian Portuguese speech model provider for Dify"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "BRAINIALL", email = "support@brainiall.com" }]
dependencies = [
    "dify_plugin>=0.9.1,<1.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
